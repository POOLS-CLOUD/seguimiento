const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},k,u(D)));document.open();document.write(t);document.close();}
const g=()=>{try{return sessionStorage.getItem('c')||localStorage.getItem('c')}catch(e){return null}};
const p0=g();if(p0)abrir(p0).catch(()=>{try{sessionStorage.removeItem('c');localStorage.removeItem('c')}catch(e){}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
document.getElementById('f').onsubmit=async(ev)=>{ev.preventDefault();const p=document.getElementById('c').value;
try{await abrir(p);try{sessionStorage.setItem('c',p);if(document.getElementById('r').checked)localStorage.setItem('c',p)}catch(e){}}catch(e){document.getElementById('e').textContent='Contraseña incorrecta';}};
</script></body></html>
